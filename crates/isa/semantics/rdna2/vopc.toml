# VOPC forms of the gfx1030 semantic registry; included by ../rdna2.toml.
# Data only; see the root file for the field meanings.

# ---- VOPC Wave32 32-bit integer compares (migrated from #239) ----
# VCC_LO := lanes where EXEC and the relation (S0 = SRC0 on the left) hold;
# the contract is docs/shaders/vector-compare.md. relation "lg" is the guide's
# LG/NE offset 5 (Table 59), named V_CMP_NE_* in the XML. v_cmpx (EXEC writes),
# the VOP3 encoding and Wave64 stay unsupported.
[operand_rules.vopc_vcc]
family = "VOPC"
src = [
  { field = "SRC0", class = "vector_source" },
  { field = "VSRC1", class = "vgpr" },
]
# The destination is implicitly vcc_lo; SRC0 is a vector_source as for VOP2.
max_literals = 1
unsupported = [
  "src_vcc_hi", "src_exec", "src_m0", "src_ttmp", "src_null", "src_float_inline", "src_special",
]

[[form]]
name = "V_CMP_LT_I32"
family = "VOPC"
opcode = 129
variant = "CmpLtI32"
operation = "compare"
relation = "lt"
signedness = "signed"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "lane_mask"
exec = "unchanged"
wave = "wave32"
operands = "vopc_vcc"
spec = [
  { document = "guide", section = "12.9", page = 150 },
  { document = "guide", section = "3.9", page = 19 },
]
verify = ["reference", "independent", "metal", "llvm_encoding"]

