# Existing gfx1030 compute controls, AMD RDNA 2 ISA guide §12.5.

[operand_rules.sopp_end]
family = "SOPP"
src = []
max_literals = 0
unsupported = []
immediate = 0

[operand_rules.sopp_branch]
family = "SOPP"
src = [{ field = "SIMM16", class = "label" }]
max_literals = 0
unsupported = []

[operand_rules.sopp_wait]
family = "SOPP"
src = [{ field = "SIMM16", class = "waitcnt" }]
max_literals = 0
unsupported = []
immediate = 0x3f70

[[form]]
name = "S_ENDPGM"
family = "SOPP"
opcode = 1
variant = "EndProgram"
operation = "end_program"
signedness = "bitwise"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "unchanged"
exec = "unchanged"
wave = "wave32"
operands = "sopp_end"
spec = [{ document = "guide", section = "12.5", page = 124 }, { document = "guide", section = "13.1.5", page = 245 }]
verify = ["reference", "independent", "metal", "llvm_encoding"]

