# SOPK forms of the gfx1030 semantic registry; included by ../rdna2.toml.
# Data only; see the root file for the field meanings.

# ---- SOPK 16-bit immediate integer forms (#215) ----
# SDST is the destination, and the left operand of the compares; SIMM16 is
# sign-extended except by the unsigned compares (guide 12.2). The word never
# takes a literal dword. SDST s0-s105 only; s0-s7 hold resource descriptors,
# so the decoder accepts them as compare operands and the translator never
# writes them.

[operand_rules.sopk_sgpr]
family = "SOPK"
dst = { field = "SDST", class = "sgpr", min = 0, max = 105 }
src = [{ field = "SIMM16", class = "simm16" }]
max_literals = 0
unsupported = ["dst_vcc", "dst_exec", "dst_ttmp", "dst_m0", "dst_null"]

[operand_rules.sopk_compare]
family = "SOPK"
src = [
  { field = "SDST", class = "sgpr", min = 0, max = 105 },
  { field = "SIMM16", class = "simm16" },
]
max_literals = 0
unsupported = ["dst_vcc", "dst_exec", "dst_ttmp", "dst_m0", "dst_null"]

[[form]]
name = "S_MOVK_I32"
family = "SOPK"
opcode = 0
variant = "MovkI32"
operation = "mov"
signedness = "signed"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "unchanged"
exec = "unchanged"
wave = "any"
operands = "sopk_sgpr"
spec = [
  { document = "guide", section = "12.2", page = 106 },
  { document = "guide", section = "13.1.2", page = 240 },
]
verify = ["reference", "independent", "metal", "llvm_encoding"]

