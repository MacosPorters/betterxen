name: Agent task
description: A self-contained work item that a contributor or coding agent can claim with /claim.
title: "task: "
labels: [agent:ready]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "hybrid: CrossOver integration, configuration, diagnostics, benchmarks (active). The areas below are preserved native research unless hybrid work requires them. cpu: translation, DBT, PE loading, guest startup, guest memory. gpu: RDNA2, shaders, Metal. runtime: Win32, CRT, C++ runtime, import generation, OS services, platform abstractions. shared: cross-subsystem interfaces. qa: verification, regression, security review."
      options:
        - hybrid
        - cpu
        - gpu
        - runtime
        - shared
        - qa
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: Interface
      description: For shared tasks, the interface name and the version or upstream commit it targets. Leave empty otherwise.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is finished, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: 'Paths the task may edit, one per line: exact paths, directories ending in "/", or globs with * and **. Two claimed tasks never overlap.'
      render: text
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance command
      description: The exact command whose success proves the task is done. It must fail before the change. It is never run automatically; a maintainer must approve it with /approve-acceptance.
      render: sh
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be closed first, for example "#12, #15". Leave empty when none.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Specification sections, interface notes and known limits. Public sources only.
