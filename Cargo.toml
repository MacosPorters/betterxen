[workspace]
members = [
    "launcher/crates/bx-cli",
    "launcher/crates/bx-probe",
    "launcher/crates/bx-telemetry",
    "launcher/crates/bx-runtime",
    "shader-transpiler/crates/dxbc-accc",
]
exclude = ["legacy-native"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
